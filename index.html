<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Badger Solar Racing Inventory</title>
</head>

<body>

<h1>Badger Solar Racing Inventory Database</h1>

<p>
This page contains the current inventory for the
Badger Solar Racing SAC storage room.
</p>

<table id="inventory" border="1">
    <thead>
        <tr>
            <th>Item</th>
            <th>Location</th>
            <th>Quantity</th>
            <th>Status</th>
            <th>Notes</th>
        </tr>
    </thead>

    <tbody></tbody>
</table>

<script>
fetch('inventory.csv')
    .then(response => response.text())
    .then(data => {

        const rows = data.trim().split('\n').slice(1);
        const tbody = document.querySelector('#inventory tbody');

        rows.forEach(row => {

            const columns = row.split(',');

            const tr = document.createElement('tr');

            columns.forEach(column => {
                const td = document.createElement('td');
                td.textContent = column;
                tr.appendChild(td);
            });

            tbody.appendChild(tr);

        });

    });
</script>

</body>
</html>
